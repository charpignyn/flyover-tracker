<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Passages satellites — au-dessus de chez vous</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<style>
  :root{
    --bg: #0a0d12;
    --panel: #10141c;
    --panel-2: #151b25;
    --line: #232b38;
    --text: #dbe2ea;
    --text-dim: #7c8a9c;
    --past: #6b7686;
    --future: #3ddc97;
    --iss: #f2b705;
    --live-ring: #ffffff;
    --danger: #e0566a;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  #app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; height: 100vh; }
  header {
    grid-column: 1 / 3;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; margin: 0; color: var(--text); white-space: nowrap; }
  header form { display: flex; gap: 8px; flex: 1; min-width: 240px; }
  header input[type=text] {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 7px 10px; border-radius: 5px; font-size: 13px; font-family: var(--sans);
  }
  header select, header button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 7px 10px; border-radius: 5px; font-size: 13px; cursor: pointer; font-family: var(--sans);
  }
  header button.primary { background: var(--future); color: #06251b; border-color: var(--future); font-weight: 600; }
  header button:disabled { opacity: 0.5; cursor: not-allowed; }
  #map { width: 100%; height: 100%; background: #060809; }
  #sidebar { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  #status {
    padding: 10px 14px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--line);
    font-family: var(--mono);
  }
  #status .bar { height: 3px; background: var(--panel-2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  #status .bar > div { height: 100%; background: var(--future); width: 0%; transition: width 0.2s; }
  #legend { display: flex; gap: 12px; padding: 8px 14px; font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #list { flex: 1; overflow-y: auto; }
  .item {
    padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.15s;
  }
  .item:hover { background: var(--panel-2); }
  .item .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .item .name { font-size: 13px; font-weight: 600; color: var(--text); }
  .item .name.iss { color: var(--iss); }
  .item .time { font-family: var(--mono); font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .item .meta { margin-top: 3px; font-size: 11.5px; color: var(--text-dim); display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600; letter-spacing: 0.2px; }
  .badge.past { background: rgba(107,118,134,0.18); color: var(--past); }
  .badge.future { background: rgba(61,220,151,0.15); color: var(--future); }
  .badge.live { background: rgba(255,255,255,0.15); color: #fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  #empty { padding: 30px 18px; color: var(--text-dim); font-size: 13px; line-height: 1.5; }
  .sat-dot-live { filter: drop-shadow(0 0 6px currentColor); }
  .leaflet-popup-content-wrapper { background: var(--panel-2); color: var(--text); }
  .leaflet-popup-tip { background: var(--panel-2); }
  .popup-title { font-weight: 600; margin-bottom: 4px; }
  .popup-line { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🛰 PASSAGES&nbsp;SAT</h1>
    <form id="geoForm">
      <input type="text" id="addressInput" placeholder="Adresse (ex: 12 rue de la Paix, Bordeaux)" />
      <button type="submit" class="primary">Localiser</button>
    </form>
    <select id="catalogSelect" title="Étendue du catalogue">
      <option value="full" selected>Catalogue complet (+ débris)</option>
      <option value="active">Actifs seulement (plus rapide)</option>
    </select>
    <select id="resSelect" title="Résolution de recherche">
      <option value="45000" selected>Résolution standard</option>
      <option value="90000">Rapide (moins précis)</option>
      <option value="20000">Précis (plus lent)</option>
    </select>
    <button id="recomputeBtn" disabled>Recalculer aujourd'hui</button>
  </header>
  <div id="map"></div>
  <div id="sidebar">
    <div id="status">Entrez une adresse pour commencer.<div class="bar"><div id="progressBar"></div></div></div>
    <div id="legend">
      <span><i class="dot" style="background:var(--past)"></i>Déjà passé</span>
      <span><i class="dot" style="background:var(--future)"></i>À venir</span>
      <span><i class="dot" style="background:var(--iss)"></i>ISS</span>
      <span><i class="dot" style="background:#fff"></i>En direct</span>
    </div>
    <div id="list"><div id="empty">Aucun passage calculé pour l'instant.</div></div>
  </div>
</div>

<script>
const BOX_HALF_WIDTH_M = 250; // carré de 500m de côté
const CANDIDATE_THRESHOLD_M = 25000; // seuil grossier avant raffinement
const LIVE_WINDOW_MS = 4 * 60 * 1000; // fenêtre d'animation "en direct" autour de maintenant

const COUNTRY_NAMES = {
  US: 'États-Unis', RU: 'Russie', CIS: 'Russie / ex-URSS', PRC: 'Chine', CN: 'Chine',
  FR: 'France', UK: 'Royaume-Uni', GB: 'Royaume-Uni', IN: 'Inde', JPN: 'Japon', JP: 'Japon',
  ESA: 'Europe (ESA)', EUTE: 'Europe (Eutelsat)', GER: 'Allemagne', ISS: 'International (ISS)',
  ISRA: 'Israël', PRK: 'Corée du Nord', ROK: 'Corée du Sud', CA: 'Canada', IT: 'Italie',
  UAE: 'Émirats arabes unis', LUXE: 'Luxembourg', NETH: 'Pays-Bas', SPN: 'Espagne',
};

const GROUPS_FULL = ['active', 'tle-new', 'stations', 'cosmos-1408-debris', 'iridium-33-debris', 'cosmos-2251-debris', 'fengyun-1c-debris', 'russian-asat-debris'];
const GROUPS_ACTIVE = ['active', 'stations'];

function classify(name, group) {
  const n = name.toUpperCase();
  if (n.includes('ISS (ZARYA)') || n.includes('ISS(ZARYA)')) return 'Station spatiale habitée';
  if (group && group.includes('debris')) return 'Débris';
  if (n.includes(' DEB') || n.endsWith('DEB')) return 'Débris';
  if (n.includes('R/B')) return 'Étage de fusée';
  if (n.startsWith('STARLINK') || n.startsWith('ONEWEB') || n.startsWith('IRIDIUM') || n.startsWith('GLOBALSTAR') || n.startsWith('ORBCOMM')) return 'Communication';
  if (n.startsWith('NOAA') || n.startsWith('GOES') || n.startsWith('METEOSAT') || n.startsWith('METOP')) return 'Météorologie';
  if (n.startsWith('GPS') || n.startsWith('GLONASS') || n.startsWith('GALILEO') || n.startsWith('BEIDOU')) return 'Navigation';
  if (n.startsWith('COSMOS') || n.startsWith('METEOR')) return 'Militaire / gouvernemental (probable)';
  return 'Fonction inconnue';
}

let map, rectLayer, homeMarker;
let liveMarkers = new Map(); // catnr -> L.CircleMarker
let staticMarkers = new Map();
let allResults = [];
let homeLat = null, homeLon = null;
let tickTimer = null;
let worker = null;

function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: true }).setView([44.84, -0.58], 13);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics',
    maxZoom: 19,
  }).addTo(map);
}

function setStatus(msg, progress) {
  const el = document.getElementById('status');
  const bar = document.getElementById('progressBar');
  el.childNodes[0].nodeValue = msg;
  if (progress === undefined) { bar.style.width = '0%'; }
  else { bar.style.width = Math.round(progress * 100) + '%'; }
}

async function geocode(address) {
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Géocodage échoué (HTTP ' + res.status + ')');
  const data = await res.json();
  if (!data.length) throw new Error('Adresse introuvable');
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name };
}

function drawHome() {
  if (rectLayer) map.removeLayer(rectLayer);
  if (homeMarker) map.removeLayer(homeMarker);

  const latOffset = BOX_HALF_WIDTH_M / 110540;
  const lonOffset = BOX_HALF_WIDTH_M / (111320 * Math.cos(homeLat * Math.PI / 180));
  const bounds = [[homeLat - latOffset, homeLon - lonOffset], [homeLat + latOffset, homeLon + lonOffset]];

  rectLayer = L.rectangle(bounds, { color: '#3ddc97', weight: 2, fillOpacity: 0.05, dashArray: '4 4' }).addTo(map);
  homeMarker = L.circleMarker([homeLat, homeLon], { radius: 4, color: '#fff', fillColor: '#fff', fillOpacity: 1 }).addTo(map);

  map.fitBounds(bounds, { maxZoom: 18, padding: [80, 80] });
}

// Parse le format TLE brut (blocs de 3 lignes) renvoyé par gp.php&FORMAT=tle
function parseTleBlock(text, group) {
  const lines = text.split('\n').map(l => l.replace(/\r$/, '')).filter(l => l.trim().length > 0);
  const sats = [];
  for (let i = 0; i + 2 < lines.length; i += 3) {
    const name = lines[i].trim();
    const line1 = lines[i + 1];
    const line2 = lines[i + 2];
    if (!line1.startsWith('1 ') || !line2.startsWith('2 ')) continue;
    const catnr = line1.substring(2, 7).trim();
    sats.push({ name, line1, line2, catnr, func: classify(name, group) });
  }
  return sats;
}

async function fetchGroup(group) {
  const url = 'https://celestrak.org/NORAD/elements/gp.php?GROUP=' + group + '&FORMAT=tle';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Groupe ' + group + ' indisponible (HTTP ' + res.status + ')');
  const text = await res.text();
  return parseTleBlock(text, group);
}

// SATCAT legacy (texte à largeur fixe, champs séparés par des espaces multiples) -> pays par numéro NORAD
async function fetchCountryMap() {
  try {
    const res = await fetch('https://celestrak.org/pub/satcat.txt');
    if (!res.ok) return {};
    const text = await res.text();
    const map = {};
    for (const line of text.split('\n')) {
      const parts = line.trim().split(/\s{2,}/);
      if (parts.length < 5) continue;
      const catnr = parts[1];
      const country = parts[4];
      if (/^\d+$/.test(catnr) && country) map[catnr] = country;
    }
    return map;
  } catch (e) {
    console.warn('SATCAT indisponible, nationalités inconnues', e);
    return {};
  }
}

async function fetchAllTles(mode) {
  const groups = mode === 'active' ? GROUPS_ACTIVE : GROUPS_FULL;
  const seen = new Set();
  const combined = [];
  for (const g of groups) {
    setStatus('Téléchargement des éléments orbitaux (' + g + ')…');
    try {
      const sats = await fetchGroup(g);
      for (const s of sats) {
        if (seen.has(s.catnr)) continue;
        seen.add(s.catnr);
        combined.push(s);
      }
    } catch (e) {
      console.warn('Groupe ignoré:', g, e.message);
    }
  }
  return combined;
}

function countryLabel(code) {
  if (!code) return 'Inconnue';
  return COUNTRY_NAMES[code] || code;
}

function fmtTime(ms) {
  const d = new Date(ms);
  return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function isISS(r) { return r.catnr === '25544'; }

function statusFor(r, now) {
  if (Math.abs(r.t - now) <= LIVE_WINDOW_MS) return 'live';
  return r.t < now ? 'past' : 'future';
}

function colorFor(r, st) {
  if (isISS(r)) return getComputedStyle(document.documentElement).getPropertyValue('--iss').trim();
  if (st === 'live') return '#ffffff';
  return st === 'past'
    ? getComputedStyle(document.documentElement).getPropertyValue('--past').trim()
    : getComputedStyle(document.documentElement).getPropertyValue('--future').trim();
}

function renderList() {
  const list = document.getElementById('list');
  const now = Date.now();
  if (!allResults.length) {
    list.innerHTML = '<div id="empty">Aucun passage détecté dans le carré aujourd\'hui avec ces réglages. C\'est normal : la zone est petite (500m). Réessayez avec le catalogue complet, ou revenez plus tard dans la journée.</div>';
    return;
  }
  list.innerHTML = '';
  for (const r of allResults) {
    const st = statusFor(r, now);
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML =
      '<div class="row1">' +
        '<span class="name' + (isISS(r) ? ' iss' : '') + '">' + escapeHtml(r.name) + '</span>' +
        '<span class="time">' + fmtTime(r.t) + '</span>' +
      '</div>' +
      '<div class="meta">' +
        '<span class="badge ' + st + '">' + (st === 'live' ? 'EN DIRECT' : st === 'past' ? 'Passé' : 'À venir') + '</span>' +
        '<span>' + countryLabel(r.country) + '</span>' +
        '<span>' + r.func + '</span>' +
        '<span>alt. ' + Math.round(r.alt) + ' km</span>' +
      '</div>';
    div.addEventListener('click', () => {
      map.flyTo([r.lat, r.lon], 18, { duration: 0.6 });
      L.popup().setLatLng([r.lat, r.lon])
        .setContent('<div class="popup-title">' + escapeHtml(r.name) + '</div>' +
          '<div class="popup-line">' + fmtTime(r.t) + ' — ' + countryLabel(r.country) + '</div>' +
          '<div class="popup-line">' + r.func + '</div>')
        .openOn(map);
    });
    list.appendChild(div);
  }
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function refreshMarkers() {
  const now = Date.now();
  for (const r of allResults) {
    const st = statusFor(r, now);
    const color = colorFor(r, st);
    let m = staticMarkers.get(r.catnr + '_' + r.t);
    if (!m) {
      m = L.circleMarker([r.lat, r.lon], {
        radius: st === 'live' ? 7 : 5,
        color, fillColor: color, fillOpacity: 0.9, weight: st === 'live' ? 2 : 1,
        className: st === 'live' ? 'sat-dot-live' : '',
      }).addTo(map);
      m.bindTooltip(r.name, { direction: 'top', offset: [0, -6] });
      staticMarkers.set(r.catnr + '_' + r.t, m);
    } else {
      m.setStyle({ color, fillColor: color, radius: st === 'live' ? 7 : 5, weight: st === 'live' ? 2 : 1 });
    }
  }
}

function startTicker() {
  if (tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(() => { renderList(); refreshMarkers(); }, 1000);
}

function runSearch(mode, coarseStepMs) {
  return new Promise(async (resolve, reject) => {
    setStatus('Préparation…', 0);
    let tles;
    try {
      tles = await fetchAllTles(mode);
    } catch (e) { return reject(e); }

    setStatus('Récupération des nationalités (SATCAT)…');
    const countryMap = await fetchCountryMap();

    setStatus('Calcul des passages (' + tles.length + ' objets)…', 0);

    if (worker) worker.terminate();
    worker = new Worker('worker.js');

    const startOfDay = new Date(); startOfDay.setHours(0, 0, 0, 0);
    const endOfDay = new Date(); endOfDay.setHours(23, 59, 59, 999);

    worker.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === 'progress') {
        setStatus('Calcul des passages… (' + msg.processed + '/' + msg.total + ')', msg.processed / msg.total);
      } else if (msg.type === 'done') {
        resolve(msg.results);
      }
    };
    worker.onerror = (err) => reject(err);

    worker.postMessage({
      tles, homeLat, homeLon,
      windowStartMs: startOfDay.getTime(),
      windowEndMs: endOfDay.getTime(),
      coarseStepMs,
      candidateThresholdM: CANDIDATE_THRESHOLD_M,
      boxHalfWidthM: BOX_HALF_WIDTH_M,
      countryMap,
    });
  });
}

async function launch() {
  document.getElementById('recomputeBtn').disabled = true;
  const mode = document.getElementById('catalogSelect').value;
  const coarseStepMs = parseInt(document.getElementById('resSelect').value, 10);

  // nettoyage des anciens marqueurs
  for (const m of staticMarkers.values()) map.removeLayer(m);
  staticMarkers.clear();
  allResults = [];
  renderList();

  try {
    const results = await runSearch(mode, coarseStepMs);
    allResults = results;
    setStatus(results.length + ' passage(s) trouvé(s) aujourd\'hui. Mis à jour en direct.');
    renderList();
    refreshMarkers();
    startTicker();
  } catch (e) {
    console.error(e);
    setStatus('Erreur : ' + e.message + ' — vérifiez la connexion (CelesTrak/Nominatim doivent être accessibles).');
  } finally {
    document.getElementById('recomputeBtn').disabled = false;
  }
}

document.getElementById('geoForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const address = document.getElementById('addressInput').value.trim();
  if (!address) return;
  setStatus('Géocodage de l\'adresse…');
  try {
    const loc = await geocode(address);
    homeLat = loc.lat; homeLon = loc.lon;
    drawHome();
    document.getElementById('recomputeBtn').disabled = false;
    await launch();
  } catch (e) {
    setStatus('Erreur : ' + e.message);
  }
});

document.getElementById('recomputeBtn').addEventListener('click', () => {
  if (homeLat !== null) launch();
});

initMap();
</script>
</body>
</html>
